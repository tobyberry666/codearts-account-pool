name: Test and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - run: go test ./... -timeout 120s
      - name: Windows bundle and isolated installer test
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-release.ps1 -Version v0.1.0
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: windows-release
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
